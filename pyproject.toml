[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jatai"
version = "0.8.17"
description = "Local file-system message bus for scripts and agents"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Enzo 'Zvorky' Zavorski Delevatti" },
]
dependencies = [
    "typer==0.12.3",
    "click==8.1.7",
    "pyyaml==6.0.1",
    "watchdog==4.0.1",
    "filelock==3.16.1",
    "textual==0.58.1",
    "send2trash==2.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest==8.2,<10",
    "pytest-cov>=5.0",
    "mutmut>=2.4.4",
    "ruff>=0.4",
    "mypy>=1.10",
    "pytest-asyncio==1.3.0",
    "types-PyYAML",
    "types-Send2Trash",
]

[project.scripts]
jatai = "jatai.cli.main:run"

[project.urls]
Homepage = "https://github.com/zvorky/jatai"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.data-files]
"share/man/man1" = ["docs/jatai.1"]

[tool.ruff]
lint.ignore = ["BLE001", "S110", "SIM117", "RUF012", "B017", "F841", "UP045", "PLW1510"]
target-version = "py311"
